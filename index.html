<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>گزارش روزانه | گردو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#f3f1ea;--gold:#f5a21a;--paper:#101842;--line:#2e3a78;--green:#ffb43a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0a0f2c;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);line-height:1.8}
.sheet{max-width:640px;margin:12px auto;background:var(--paper);border:3px double var(--gold);padding:16px}
header{text-align:center;background:#0a0f2c;border:1px solid var(--line);border-radius:10px;padding:14px 10px 10px;margin-bottom:12px}
header img{width:120px;height:120px;border-radius:50%;display:block;margin:0 auto 6px}
header h1{margin:0;font-size:20px;font-weight:800;color:#f5a21a}
header p{margin:0;font-size:12px;color:#cfd3ee}
footer{text-align:center;margin-top:16px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:#c9cdf0;direction:ltr}
h2{font-size:15px;margin:18px 0 8px;border-right:5px solid var(--gold);padding-right:8px}
label{display:block;font-size:12px;color:#c9cdf0;margin-bottom:2px}
input,textarea,select{width:100%;font:inherit;font-size:14px;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:#0b1130;color:var(--ink)}
::placeholder{color:#7f86bd}
textarea{resize:vertical}
.g{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#172052;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;position:relative}
.card h3{margin:0 0 6px;font-size:13px;color:var(--gold)}
.del{position:absolute;left:8px;top:6px;background:none;border:0;color:#ff7a6b;font-size:20px;cursor:pointer}
.b{font:inherit;font-size:14px;padding:9px 14px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#0a0f2c;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.b.o{background:transparent;color:var(--gold)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:#172052;border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 2px}
.sum b{display:block;font-size:19px;color:var(--green)}
.sum small{font-size:11px;color:#aab0dc}
.prog{width:100%;accent-color:var(--gold);padding:0}
.pv{text-align:center;font-weight:800;color:var(--gold)}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#f5a21a;color:#0a0f2c;padding:8px 16px;border-radius:20px;font-size:13px;display:none}
@media(max-width:420px){.g4{grid-template-columns:1fr 1fr}.sheet{margin:0;border-width:2px}}
</style>
</head>

<div class="g">
<div style="grid-column:1/-1"><label>نام و نام خانوادگی</label><input id="name"></div>
<div><label>پایه تحصیلی</label><select id="grade"><option value="">انتخاب کنید</option><option>هفتم</option><option>هشتم</option><option>نهم</option><option>دهم</option><option>یازدهم</option><option>دوازدهم</option><option>فارغ‌التحصیل</option></select></div>
<div><label>رشته</label><select id="track"><option value="">انتخاب کنید</option><option>متوسطه اول</option><option>تجربی</option><option>ریاضی</option><option>انسانی</option><option>فنی‌حرفه‌ای</option></select></div>
<div style="grid-column:1/-1"><label>تاریخ</label><input id="date"></div>
</div>

<h2>گزارش پارت‌ها (حداکثر ۹ پارت)</h2>
<div id="parts"></div>
<button class="b o" id="add">+ افزودن پارت</button>

<h2>جمع‌بندی امروز</h2>
<div class="sum" id="sum"></div>
<div id="txt" style="margin-top:8px;font-size:14px;background:#1c2760;border-radius:8px;padding:8px 10px"></div>

<h2>نظر من درباره پیشرفت خودم</h2>
<input class="prog" id="prog" type="range" min="0" max="100" step="5" value="50">
<div class="pv" id="pv"></div>

<h2>انتقاد شخصی من از امروز</h2>
<textarea id="crit" rows="7" placeholder="امروز چه کارهایی خوب پیش رفت؟ چه کارهایی بد؟ فردا چه چیزی را عوض می‌کنم؟"></textarea>

<div class="act">
<button class="b" id="copy">کپی گزارش</button>
<button class="b" id="share">ارسال گزارش</button>
<a class="b" id="tg" target="_blank" rel="noopener">تلگرام</a>
<a class="b" id="wa" target="_blank" rel="noopener">واتساپ</a>
<button class="b o" id="clr">گزارش جدید</button>
</div>
<footer>Telegram: @study_gerdo &nbsp;|&nbsp; Instagram: study_gerdo</footer>
</div>
<div class="toast" id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)},K="gerdoo-daily-v1",F=["name","grade","track","date","prog","crit"],parts=[];
function fa(x){return String(x).replace(/\d/g,function(d){return"۰۱۲۳۴۵۶۷۸۹"[d]})}
function n(v){v=parseFloat(v);return isNaN(v)||v<0?0:v}
function blank(){return{t:"",h:0,m:0,q:0,w:0}}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function save(){try{var o={p:parts,f:{}};F.forEach(function(k){o.f[k]=$(k).value});localStorage.setItem(K,JSON.stringify(o))}catch(e){}}
function load(){try{var o=JSON.parse(localStorage.getItem(K));if(o){parts=o.p||[];F.forEach(function(k){if(o.f&&o.f[k]!=null)$(k).value=o.f[k]})}}catch(e){}
if(!parts.length)parts=[blank(),blank(),blank()];
if(!$("date").value){try{$("date").value=new Date().toLocaleDateString("fa-IR")}catch(e){}}}
function render(){$("parts").innerHTML=parts.map(function(p,i){
return'<div class="card" data-i="'+i+'"><button class="del" data-del="'+i+'" title="حذف">×</button><h3>پارت '+fa(i+1)+'</h3>'+
'<label>توضیح (درس / مبحث / کاری که انجام دادی)</label><textarea data-k="t" rows="2">'+esc(p.t)+'</textarea>'+
'<div class="g g4" style="margin-top:6px"><div><label>ساعت</label><input type="number" inputmode="numeric" min="0" data-k="h" value="'+(p.h||"")+'"></div>'+
'<div><label>دقیقه</label><input type="number" inputmode="numeric" min="0" max="59" data-k="m" value="'+(p.m||"")+'"></div>'+
'<div><label>تعداد سوال</label><input type="number" inputmode="numeric" min="0" data-k="q" value="'+(p.q||"")+'"></div>'+
'<div><label>تعداد غلط</label><input type="number" inputmode="numeric" min="0" data-k="w" value="'+(p.w||"")+'"></div></div></div>'}).join("");
$("add").style.display=parts.length>=9?"none":"inline-block";calc()}
function tot(){var min=0,q=0,w=0;parts.forEach(function(p){min+=p.h*60+p.m;q+=p.q;w+=Math.min(p.w,p.q||p.w)});
var ok=Math.max(0,q-w);return{min:min,q:q,w:w,ok:ok,acc:q?ok/q*100:0,net:q?Math.max(0,(ok-w/3)/q*100):0}}
function tm(min){var h=Math.floor(min/60),m=Math.round(min%60);return fa(h)+" ساعت و "+fa(m)+" دقیقه"}
function calc(){var t=tot();
$("sum").innerHTML=[[tm(t.min),"کل زمان مطالعه"],[fa(t.q),"کل سوال"],[fa(t.w),"کل غلط"],[fa(t.ok),"درست"],[fa(Math.round(t.acc))+"٪","درصد"],[fa(Math.round(t.net))+"٪","با نمره منفی"]].map(function(x){return"<div><b>"+x[0]+"</b><small>"+x[1]+"</small></div>"}).join("");
$("txt").textContent=t.q||t.min?"امروز "+tm(t.min)+" مطالعه کردی و "+fa(t.q)+" سوال زدی؛ "+fa(t.ok)+" تا درست و "+fa(t.w)+" تا غلط. درصد کل: "+fa(Math.round(t.acc))+"٪ (با نمره منفی: "+fa(Math.round(t.net))+"٪).":"هنوز چیزی ثبت نشده.";
$("pv").textContent=fa($("prog").value)+"٪ از پیشرفت دلخواهم"}
function report(){var t=tot(),L=["📋 گزارش روزانه — مؤسسه گردو",
"نام: "+($("name").value||"—"),"پایه: "+($("grade").value||"—")+" | رشته: "+($("track").value||"—"),"تاریخ: "+($("date").value||"—"),""];
parts.forEach(function(p,i){if(p.t||p.h||p.m||p.q||p.w)L.push("پارت "+fa(i+1)+": "+(p.t||"—")+"\n   زمان: "+fa(p.h)+":"+fa(("0"+p.m).slice(-2))+" | سوال: "+fa(p.q)+" | غلط: "+fa(p.w))});
L.push("","📊 جمع امروز:","زمان کل: "+tm(t.min),"سوال: "+fa(t.q)+" | درست: "+fa(t.ok)+" | غلط: "+fa(t.w),"درصد: "+fa(Math.round(t.acc))+"٪ | با نمره منفی: "+fa(Math.round(t.net))+"٪","",
"نظر من درباره پیشرفتم: "+fa($("prog").value)+"٪");
if($("crit").value)L.push("","انتقاد شخصی من از امروز:",$("crit").value);
return L.join("\n")}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},2000)}
function links(){var e=encodeURIComponent(report());$("tg").href="https://t.me/share/url?url=%20&text="+e;$("wa").href="https://wa.me/?text="+e}
document.addEventListener("input",function(e){var t=e.target,c=t.closest(".card");
if(c&&t.dataset.k){var k=t.dataset.k;parts[+c.dataset.i][k]=k==="t"?t.value:n(t.value)}save();calc()});
document.addEventListener("click",function(e){var d=e.target.dataset.del;if(d!=null){parts.splice(+d,1);if(!parts.length)parts=[blank()];render();save()}});
$("add").onclick=function(){if(parts.length<9){parts.push(blank());render();save()}};
$("copy").onclick=function(){var tx=report();function fb(){var a=document.createElement("textarea");a.value=tx;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("گزارش کپی شد")}catch(e){toast("کپی نشد")}a.remove()}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){toast("گزارش کپی شد")},fb)}else fb()};
$("share").onclick=function(){if(navigator.share){navigator.share({text:report()}).catch(function(){})}else{$("copy").click()}};
$("tg").onclick=$("wa").onclick=$("tg").ontouchstart=$("wa").ontouchstart=$("tg").onmouseenter=$("wa").onmouseenter=links;
$("clr").onclick=function(){if(confirm("گزارش امروز پاک شود و گزارش جدید شروع شود؟")){parts=[blank(),blank(),blank()];$("crit").value="";$("prog").value=50;try{$("date").value=new Date().toLocaleDateString("fa-IR")}catch(e){}render();save()}};
F.forEach(function(k){$(k).addEventListener("input",function(){save();calc()});$(k).addEventListener("change",save)});
load();render();
</script>
